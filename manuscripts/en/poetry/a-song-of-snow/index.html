<!DOCTYPE html><div class="article-body" data-folio-ready="1"><p>Winter comes sighing, and how much sorrow with it.<br>
The willows on the bank are thinning;<br>
the old pines have gone white.</p>
<p>The winter crows circle and call, and will not settle.<br>
They must be wondering whether the slender boughs,<br>
with all that snow to bear, can bear them too.</p></div>
