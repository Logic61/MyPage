<!DOCTYPE html><div class="article-body" data-folio-ready="1"><p>—— 旧文，曾为作业而写，而意外勾起一段情谊，虽稚嫩，再看，万绪杂然 ——</p>
<hr>
<p>中秋佳节，又是一年
秋月悄悄呈圆</p>
<p>李白可曾忖量
与他对酌的明月
千年后可否如先</p>
<p>藏几块月饼于袖间
将送与望舒吃
冀幸她把清辉留在人间
与我们共驱新冠出九天</p>
<p>诵《芣苢》与月
邀明月共游意趣田园
不知她
可愿掇捋采采芣苢
品赏人间百花鲜妍</p>
<p>云月间
见蟾光几许
应是李白的酒
洒落在天仙揉碎的云边</p>
<p>前人将美酒藏入竹简
作魂灵所品的香甜
酒中闪动清辉，沉浮皎月
使我们有力将黑暗驱散
让我们得以乐看年年月圆</p>
<hr>
<p>作于2020年中秋</p>
<p>题选于若昔</p>
