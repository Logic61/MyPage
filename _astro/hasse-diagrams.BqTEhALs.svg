  <g fill="none" stroke="#407872" stroke-width="2">
    <path d="M170 192 80 150 M170 192 141 150 M170 192V150 M170 192 245 150 M141 150 90 107 M141 150V107 M170 150 141 107 M170 150V107 M170 107V64" />
    <path d="M498 192 390 146 M498 192V146 M498 192 606 146 M390 146V100 M390 146 498 100 M498 146 390 100 M498 146 606 100 M606 146 498 100 M606 146V100 M390 100 498 55 M498 100V55 M606 100 498 55" />
